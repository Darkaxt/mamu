# Gradle JVM settings
org.gradle.jvmargs=-Xms256m -Xmx3072m -Dfile.encoding=UTF-8
# Existing JBR25 builds the host and links/shrinks the pinned embedded OpenJDK25 runtime.
# AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# AGP 9
android.builtInKotlin=true
# Performance & caching
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=false
org.gradle.tooling.parallel=true

org.gradle.workers.max=2
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_25_X64
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
